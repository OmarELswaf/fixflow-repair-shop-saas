# FixFlow — throwaway PostgreSQL 16 for local validation ONLY.
#
# Used by `npm run test:pg16` (scripts/local-pg16-test.mjs). Do NOT use
# this file for development or production data: it starts a throwaway
# postgres:16-alpine container with a run-suffixed name and volume,
# publishes ONLY on 127.0.0.1, and is stopped and deleted (container
# and volume) when the run finishes, even on failure.
#
# Required variables (the script sets them; never hand-write them):
# - PG16_TEST_SUFFIX: run suffix, e.g. a random hex string. It makes
#   the container and volume names unique per run so two runs cannot
#   clobber each other.
# - PG16_TEST_OWNER_PASSWORD: password for the fixflow_owner role
#   (the migration/owner role). Generated per run, never printed.
# - PG16_TEST_APP_PASSWORD: password for the fixflow_app role (the
#   non-owner NOBYPASSRLS runtime role). Generated per run, never
#   printed.
# Optional:
# - PG16_TEST_PORT (default 15440): the localhost port published to
#   the container's 5432. It must match the port in the
#   FIXFLOW_TEST_DATABASE_URL the operator declared.
#
# The database itself is NOT created here: the script creates the
# throwaway database (owned by fixflow_owner) and the fixflow_app
# role with grants after the container is healthy, runs
# `prisma migrate deploy` against it, and drops it again in teardown.
# See docs/LOCAL_VALIDATION.md.
services:
  pg16-test:
    image: postgres:16-alpine
    container_name: fixflow-pg16-test-${PG16_TEST_SUFFIX:?PG16_TEST_SUFFIX is required}
    environment:
      POSTGRES_USER: fixflow_owner
      POSTGRES_PASSWORD: ${PG16_TEST_OWNER_PASSWORD:?PG16_TEST_OWNER_PASSWORD is required}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${PG16_TEST_PORT:-15440}:5432'
    volumes:
      - pg16_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fixflow_owner -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pg16_test_data:
    name: fixflow-pg16-test-${PG16_TEST_SUFFIX:?PG16_TEST_SUFFIX is required}
