services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fixflow
      POSTGRES_USER: fixflow_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-app-role.sh:/docker-entrypoint-initdb.d/001-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fixflow_owner -d fixflow']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine

    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_OWNER_URL: postgresql://fixflow_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/fixflow?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://fixflow_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/fixflow?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-CHANGE_ME_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-CHANGE_ME_REFRESH_SECRET}
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:5173'
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
